name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'

jobs:
  deploy-main:
    name: Deploy to Production (main)
    runs-on: ubuntu-latest
    steps:
      - name: Execute SSH commands on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Navigate to the backend directory
            cd ~/one-point-interview-ai/backend
            
            # Fix the remote URL just in case it's pointing to the old repo
            git remote set-url origin https://github.com/AltamashAhmad/one-point-interview-ai.git
            
            # Discard any local changes just in case, then pull the latest code
            git reset --hard
            git pull origin main
            
            # Install dependencies (only updates if package.json changed)
            npm install
            
            # Restart all PM2 processes to ensure the backend picks up the new code
            # We use 'all' in case the process wasn't named 'backend-main' initially
            pm2 restart all || pm2 start index.js --name "backend-main"
